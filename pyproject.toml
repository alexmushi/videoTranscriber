[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videotranscriber"
version = "0.1.0"
description = "Summarize long Google Drive videos with Claude using a transcript plus screenshots taken when the screen changes"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.12",
    "gdown>=5.2",
    "faster-whisper>=1.0",
    "numpy>=1.26",
    "pillow>=10",
]

[project.scripts]
videotranscriber = "videotranscriber.cli:main"

[tool.setuptools]
packages = ["videotranscriber"]
